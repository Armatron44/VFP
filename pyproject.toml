[tool.poetry]
name = "vfp"
version = "0.2.0"
description = "Calculate neutron and x-ray reflectivity profiles via physical volume fraction profiles."
authors = ["Alexander Armstrong <sandyjoarmstrong@hotmail.com>"]
license = "BSD 3-Clause"
readme = "README.md"
packages = [{include = "vfp", from="src"}]

[tool.poetry.dependencies]
python = ">=3.11"
matplotlib = ">=3.10.0"
numpy = ">=2.2"
scipy = ">=1.14"
refnx = ">=0.1.51"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^5.0.0"
jupyter = "^1.0.0"
ruff = "^0.9.3"
black = "^24.10.0"

[tool.poetry.group.refl1d.dependencies]
refl1d = {version = "^0.8.16", optional = true}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79

[tool.ruff]
src = ["src"]
line-length = 79

[tool.ruff.lint]
ignore = ["E501"]

# Exclude specific paths or files
exclude = ["tests/"]
