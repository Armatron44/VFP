[tool.poetry]
name = "vfp"
version = "0.2.0"
description = "Calculate neutron and x-ray reflectivity profiles via physical volume fraction profiles."
authors = ["Alexander Armstrong <sandyjoarmstrong@hotmail.com>"]
license = "BSD 3-Clause"
readme = "README.md"
packages = [{include = "vfp", from="src"}]

[tool.poetry.dependencies]
python = ">=3.11"
matplotlib = ">=3.10.0"
numpy = ">=2.2"
scipy = ">=1.14"
refnx = ">=0.1.51"

[tool.poetry.group.refl1d.dependencies]
optional = true
refl1d = ">=0.8.16"

[tool.poetry.dev-dependencies]

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^5.0.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
